<!DOCTYPE html>
<html>
<head>
    <title>SocialSky</title>
    <meta property="og:title" content="Check this out on SocialSky" />
    <script>
        // Extract the path (e.g., /reel/123)
        const path = window.location.pathname;
        
        // Attempt to open the app using the custom scheme
        window.location.href = "socialsky://" + path;

        // Fallback: If the app doesn't open in 2 seconds, stay on page or redirect to store
        setTimeout(() => {
            console.log("App didn't open, staying on landing page.");
        }, 2000);
    </script>
</head>
<body>
    <h1>Opening SocialSky...</h1>
    <p>If the app doesn't open, <a href="socialsky://">click here</a>.</p>
</body>
</html>
